spring.application.name=EnterpriseTester
# Локальная конфигурация без Git
spring.config.import=optional:file:./application-local.properties

# Подключение к MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/enterprisetesterdb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# Пул подключений к БД
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=5

# Показывать таймер
testing.show-countdown=true
# Разрешить лимит времени
testing.enable-time-limit=true
# Оценка множественных ответов
testing.multi-answer-mode=PARTIAL
# Число вопросов теста
testing.default-questions-count=20
# Каталог изображений
testing.upload-dir=assets/questions
# Лимиты загрузки изображений
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=105MB
