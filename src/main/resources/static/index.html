<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Авторизация</title>

  <link rel="stylesheet" href="/css/general.css">
  <link rel="stylesheet" href="/css/authpage.css">
</head>
<body class="auth-page">

<div class="auth-modal-body">
  <label class="auth-title">Авторизация</label>

  <label>
    <input
            id="email"
            class="auth-input"
            type="email"
            placeholder="Email"
            maxlength="100"
    >
  </label>

  <label>
    <input
            id="password"
            class="auth-input"
            type="password"
            placeholder="Пароль"
            maxlength="255"
    >
  </label>

  <div class="auth-message" id="auth-message">
  </div>

  <button class="auth-button" onclick="login()">
    Войти
  </button>
</div>
<script src="/js/authpage.js"></script>

</body>
</html>
