<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Главная</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="/css/general.css">
    <link rel="stylesheet" href="/css/mainpage.css">
</head>
<body class="main-page">

<header class="main-header">
    <span class="user-name" th:text="${fullName}">Имя Фамилия</span>
    <div class="header-actions">
        <a class="management-button" th:if="${canManage}" href="/management">Управление</a>
        <a class="profile-button" href="/profile">Профиль</a>
    </div>
</header>

<main class="main-content">
    <p class="error-message" th:if="${param.error != null}">Тест недоступен или уже завершён.</p>
    <h1>Тесты</h1>
    <div class="tests-container">
        <a class="test-card" th:each="test : ${tests}" th:href="@{/tests/{id}(id=${test.id})}">
            <h2 th:text="${test.name}">Название теста</h2>
            <p th:text="${test.description}">Описание теста</p>
        </a>
        <p th:if="${tests.isEmpty()}">Пока нет доступных тестов.</p>
    </div>
</main>

</body>
</html>
